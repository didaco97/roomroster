[build]
  command = "npm run build && node --import tsx server/deploy-prepare.ts"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
  VITE_DEMO_MODE = "false"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[functions.digest]
  schedule = "30 5,11 * * *"
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
